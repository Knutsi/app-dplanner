[project]
name = "dplanner"
version = "0.1.0"
description = "An application built on app-framework"
requires-python = ">=3.13,<3.15"
dependencies = [
    "PySide6-Essentials>=6.9,<7",
    "keyring>=25.0",
    "openai>=1.50",
    "anthropic>=0.40",
    # In-app PDF rendering for spec documents. Deliberately not the full PySide6 (QtPdf
    # lives in the hundreds-of-MB Addons package); pdfium is one small native wheel.
    "pypdfium2>=5",
]

[project.scripts]
dplanner = "dplanner.entry:main"

# The window, with the word typed for you. A gui-script rather than a script so that on
# Windows it is an executable with no console window behind it — what a Start Menu
# shortcut should open. `dplanner desktop install` writes the launcher that opens it.
[project.gui-scripts]
dpw = "dplanner.entry:window_main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dplanner"]

[dependency-groups]
dev = [
    "mypy>=1.16",
    # Frozen builds: `uv run pyinstaller dplanner.spec`. GPL-2.0 **with an exception that
    # permits closed and commercial builds**, plus Apache-2.0 parts — the frozen output
    # carries whatever licence we choose, and only changes to PyInstaller's own source would
    # fall under the GPL. Nothing here changes it. In `dev` rather than a group of its own
    # because a Linux developer running the spec is how the spec stays correct between the
    # rare Windows builds.
    "pyinstaller>=6.11",
    "pytest>=8.4",
    "pytest-qt>=4.5",
    "pytest-xdist>=3.6",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# -n auto: one worker per core. Nearly every test builds a whole application, so the suite is
# CPU-bound and scales almost linearly — and each worker is its own process, which is what a
# QApplication needs anyway (only one may exist per process, and it cannot be recreated).
# Add `-n0` for a single-threaded run when a failure needs readable output or a debugger.
addopts = "-ra --strict-markers --strict-config -n auto"
markers = [
    "raises_in_a_slot: the test raises inside a signal slot on purpose (see conftest.py)",
]

# The repository root, so a test file can share helpers with a sibling (tests/cli/spec_helpers.py)
# under the same dotted name mypy resolves.
pythonpath = ["."]
qt_api = "pyside6"
qt_default_raising = true

[tool.mypy]
python_version = "3.13"
mypy_path = ["src", "."]
files = ["src/dplanner", "tests", "freeze"]
explicit_package_bases = true
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# pypdfium2 ships no py.typed; its objects are used behind our own typed wrappers.
module = "pypdfium2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests may skip annotations; everything they call is still checked.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Proposals under docs/ quote Python with aligned comments: prose, not code to format.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "TID", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Qt virtual methods must keep their camelCase names and parameter names to override correctly.
"src/dplanner/theme/style.py" = ["N802", "N803"]
# Storage-format fixtures are one element per line; wrapping XML mid-tag reads worse.
"tests/modules/test_confluence_convert.py" = ["E501"]

[tool.ruff.format]
docstring-code-format = true
